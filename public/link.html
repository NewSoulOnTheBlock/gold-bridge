<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>$GOLD — Link Wallet</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:#0b0d10; color:#e8eaed;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:460px; background:#14181d; border:1px solid #232a31; border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:22px; } h1 span { color:#f5b301; }
  p.sub { margin:0 0 20px; color:#9aa4ad; font-size:14px; }
  label { display:block; font-size:13px; color:#9aa4ad; margin:14px 0 6px; }
  input { width:100%; box-sizing:border-box; padding:11px 12px; background:#0b0d10; border:1px solid #2a323a;
          border-radius:9px; color:#e8eaed; font-size:15px; letter-spacing:1px; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:9px; font-size:15px; font-weight:600;
           background:#f5b301; color:#1a1400; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { margin-top:16px; padding:12px; border-radius:9px; font-size:14px; display:none; }
  .status.show { display:block; }
  .ok { background:#10331d; color:#7ee2a8; } .err { background:#3a1717; color:#f0a0a0; }
  .row { display:flex; gap:10px; align-items:center; margin-top:8px; font-size:13px; color:#9aa4ad; }
  hr { border:0; border-top:1px solid #232a31; margin:26px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Link your <span>$GOLD</span> wallet</h1>
  <p class="sub">Connect the EVM wallet where you want to receive $GOLD from the Robinhood DayZ server.</p>

  <label for="code">Link code (from in-game)</label>
  <input id="code" placeholder="ABCD1234" autocomplete="off" />
  <button id="linkBtn">Connect wallet &amp; link</button>
  <div id="linkStatus" class="status"></div>

  <hr />
  <h1 style="font-size:18px;">Claim rewards</h1>
  <p class="sub">Already linked? Send your accrued $GOLD to your wallet.</p>
  <button id="claimBtn">Connect wallet &amp; claim</button>
  <div id="claimStatus" class="status"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const show = (el, msg, ok) => { el.textContent = msg; el.className = "status show " + (ok ? "ok" : "err"); };
const qcode = new URLSearchParams(location.search).get("code");
if (qcode) $("code").value = qcode;

async function connect() {
  if (!window.ethereum) throw new Error("No EVM wallet found. Install MetaMask.");
  const [addr] = await window.ethereum.request({ method: "eth_requestAccounts" });
  return addr;
}
async function sign(address, message) {
  return await window.ethereum.request({ method: "personal_sign", params: [message, address] });
}

$("linkBtn").onclick = async () => {
  const el = $("linkStatus"); const code = $("code").value.trim().toUpperCase();
  try {
    if (!code) throw new Error("Enter your in-game link code.");
    show(el, "Looking up code…", true);
    const look = await (await fetch("/link/lookup?code=" + encodeURIComponent(code))).json();
    if (look.error) throw new Error(look.error);
    const address = await connect();
    show(el, "Sign the message in your wallet…", true);
    const signature = await sign(address, look.message);
    const r = await (await fetch("/link/verify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, address, signature }),
    })).json();
    if (r.error) throw new Error(r.error);
    show(el, "Linked! " + r.address + " ↔ Steam " + r.steamId, true);
  } catch (e) { show(el, e.message || String(e), false); }
};

$("claimBtn").onclick = async () => {
  const el = $("claimStatus");
  try {
    const address = await connect();
    show(el, "Fetching claim challenge…", true);
    const ch = await (await fetch("/claim/challenge?address=" + address)).json();
    if (ch.error) throw new Error(ch.error);
    if (ch.pending === "0") { show(el, "Nothing to claim yet.", false); return; }
    show(el, "Sign to claim " + ch.pending + " $GOLD…", true);
    const signature = await sign(address, ch.message);
    const r = await (await fetch("/claim", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ address, signature }),
    })).json();
    if (r.error) throw new Error(r.error);
    show(el, "Paid " + r.amount + " $GOLD — tx " + r.txHash, true);
  } catch (e) { show(el, e.message || String(e), false); }
};
</script>
</body>
</html>
